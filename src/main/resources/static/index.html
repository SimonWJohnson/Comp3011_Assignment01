<!DOCTYPE html>
<html lang="en">
	<!--metadata, page title, css link-->
	<head>
		<!--unicode character set-->
		<meta charset="UTF-8">
		<!--make viewport correspond to device width and begin at normal zoom-->
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<!--Title-->
		<title>Speech to Text</title>
		<!--css link-->
		<link rel="stylesheet" href="css/style.css">
	</head>
	<!--heading, recording controls status indicator, transcription-->
	<body>
		<!--introductory content-->
		<header>
			<h1>Speech to Text</h1>
			<p>Record audio and convert it to text using a cloud transcription service.</p>
		</header>
		<!--container for primary application content-->
		<main>
			<!--group related content into meaningful regions-->
			<!--recording interface-->
			<section class="panel">
				<h2>Recorder</h2>
				
				<p id="recording-status">
					<span id="status-indicator"></span> <!--Coloured dot indicator-->
					Status: 
					<span id="status-text">Ready</span> <!--Changing text-->
				</p>
				
				<!--buttons-->
				<button type="button" class="control-button" id="start-recording"><!--should be disabled when recording begins-->
					Start Recording
				</button> 
				<button type="button" class="control-button" id="stop-recording" disabled><!--should be disabled when in ready state-->
					Stop Recording
				</button> 
			</section>
			
			<!--Transcription interface-->
			<section class="panel">
				<h2>Transcription</h2>
				
				<p id="transcription-output">Your transcription will appear here.</p>
			</section>
		</main>
		
		
		<script src="js/app.js"></script>
	</body>
</html>
